<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="12" fill="#1a1a2e"/>
  <g transform="translate(64,64)">
    <!-- Chess board pattern -->
    <g transform="translate(-28,-28)" opacity="0.3">
      <rect x="0" y="0" width="14" height="14" fill="#4a4a6a"/>
      <rect x="14" y="0" width="14" height="14" fill="#2a2a4a"/>
      <rect x="28" y="0" width="14" height="14" fill="#4a4a6a"/>
      <rect x="42" y="0" width="14" height="14" fill="#2a2a4a"/>
      <rect x="0" y="14" width="14" height="14" fill="#2a2a4a"/>
      <rect x="14" y="14" width="14" height="14" fill="#4a4a6a"/>
      <rect x="28" y="14" width="14" height="14" fill="#2a2a4a"/>
      <rect x="42" y="14" width="14" height="14" fill="#4a4a6a"/>
      <rect x="0" y="28" width="14" height="14" fill="#4a4a6a"/>
      <rect x="14" y="28" width="14" height="14" fill="#2a2a4a"/>
      <rect x="28" y="28" width="14" height="14" fill="#4a4a6a"/>
      <rect x="42" y="28" width="14" height="14" fill="#2a2a4a"/>
      <rect x="0" y="42" width="14" height="14" fill="#2a2a4a"/>
      <rect x="14" y="42" width="14" height="14" fill="#4a4a6a"/>
      <rect x="28" y="42" width="14" height="14" fill="#2a2a4a"/>
      <rect x="42" y="42" width="14" height="14" fill="#4a4a6a"/>
    </g>
    <!-- Sword crossing -->
    <line x1="-20" y1="20" x2="20" y2="-20" stroke="#d4a44c" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="-20" y2="-20" stroke="#c0c0c0" stroke-width="3" stroke-linecap="round"/>
    <!-- Blood splatter -->
    <circle cx="0" cy="0" r="4" fill="#8b0000" opacity="0.7"/>
    <circle cx="5" cy="-3" r="2" fill="#8b0000" opacity="0.5"/>
    <circle cx="-4" cy="4" r="2.5" fill="#8b0000" opacity="0.6"/>
  </g>
  <!-- Title -->
  <text x="64" y="118" text-anchor="middle" font-family="serif" font-weight="bold" font-size="14" fill="#d4a44c">BATTLE</text>
</svg>
